<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Birthday Surprise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b0a21;
  --bg2:#4a0f35;
  --ink:#fff3e4;
  --muted:#e8c3d4;
  --pink:#ff3d7f;
  --gold:#ffc83d;
  --font-display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%) fixed,var(--bg);
  color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  min-height:100vh;
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;min-height:calc(100vh - 64px);justify-content:center}
.dots{display:flex;gap:8px;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;justify-content:center;z-index:5}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.3;transition:.3s}
.dots i.on{background:var(--gold);opacity:1;transform:scale(1.3)}

/* Music Control Button Style */
.music-toggle{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:10;
  background:rgba(255,255,255,0.15);border:1px solid var(--muted);color:var(--ink);
  padding:6px 12px;border-radius:99px;cursor:pointer;font-size:0.85rem;font-family:var(--font-body);
  backdrop-filter:blur(4px);transition:background .2s;
}
.music-toggle:hover{background:rgba(255,255,255,0.25);}

.step{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;animation:in .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,9vw,3rem)}
h2{font-size:clamp(1.7rem,7vw,2.2rem);color:var(--gold)}
p{margin:0;color:var(--muted);max-width:32ch;text-wrap:balance}
.btn{
  font:700 1.15rem/1 var(--font-body);color:#2b0a21;background:var(--gold);
  border:0;border-radius:999px;padding:16px 30px;cursor:pointer;
  box-shadow:0 6px 0 #b8861a,0 14px 30px rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b8861a,0 6px 12px rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #a3194c,0 14px 30px rgba(0,0,0,.35)}
.btn.pink:active{box-shadow:0 1px 0 #a3194c,0 6px 12px rgba(0,0,0,.35)}
.polaroid{background:var(--ink);padding:12px 12px 16px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(var(--tilt,-2deg));max-width:100%;animation:drop .8s cubic-bezier(.2,.9,.3,1.3) both}
.polaroid img,.polaroid video{display:block;width:auto;max-width:100%;max-height:52vh;border-radius:3px;background:#000;margin:0 auto}
.polaroid figcaption{font-family:var(--font-display);color:#4a0f35;font-size:1.25rem;margin-top:12px;text-wrap:balance}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(8deg) scale(.9)}to{opacity:1;transform:rotate(var(--tilt,-2deg))}}
/* candle */
.cake{width:230px;max-width:70vw;height:auto;overflow:visible}
.part{transform-box:fill-box;transform-origin:50% 100%;animation:stack .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}
@keyframes stack{from{opacity:0;transform:translateY(-70px) scaleY(.7)}to{opacity:1;transform:none}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s 1.8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transform:scale(0)}
.lit .flame{opacity:1;transform:scale(1);animation:flick 1.1s ease-in-out infinite alternate;transition:.5s}
.glow{opacity:0;transition:opacity .6s}
.lit .glow{opacity:1}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08,.95) rotate(3deg)}}
.count{font-family:var(--font-display);font-size:7rem;line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--pink);animation:pop .9s ease-out both;min-height:7rem}
@keyframes pop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
/* finale */
.big{font-size:clamp(3rem,15vw,5rem);line-height:.95;color:var(--gold);text-shadow:0 4px 0 var(--pink),0 10px 30px rgba(0,0,0,.4)}
.big span{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
.big span:nth-child(2n){animation-delay:.15s}.big span:nth-child(3n){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-2deg)}}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.row .polaroid{width:calc(33% - 8px);min-width:96px;padding:6px 6px 8px;animation:none}
.row .polaroid img{max-height:140px;width:100%;object-fit:cover}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:8px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lit .flame{opacity:1;transform:scale(1)}}
</style>

<!-- 
  ==================================================
  INSERT YOUR AUDIO ADDRESS HERE (replace YOUR_MUSIC_URL.mp3)
  ==================================================
-->
<audio id="bg-music" src="song.mp3" loop preload="auto"></audio>
<button class="music-toggle" id="music-btn" aria-label="Toggle background music">🎵 Music: Off</button>

<div class="dots" id="dots" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="stage"></main>

<script>
// Put her name here, e.g. "Riya" (leave empty for no name)
const NAME = "Mantasha";
const who = NAME ? ", " + NAME : "";
const stage = document.getElementById("stage");
const dots = document.getElementById("dots");
let cur = -1;

// Music handling
const audio = document.getElementById("bg-music");
const musicBtn = document.getElementById("music-btn");

musicBtn.onclick = () => {
  if (audio.paused) {
    audio.play().then(() => {
      musicBtn.textContent = "🔊 Music: On";
    }).catch(err => console.log("Playback prevented"));
  } else {
    audio.pause();
    musicBtn.textContent = "🔇 Music: Off";
  }
};

// Automatically play music on first click/interaction
function tryPlayMusic() {
  if (audio.paused) {
    audio.play().then(() => {
      musicBtn.textContent = "🔊 Music: On";
    }).catch(() => {});
  }
}

const steps = [
  () => `
    <h1>Psst${who}. This one is just for you.</h1>
    <svg class="cake" id="candle" viewBox="0 0 220 240" role="img" aria-label="A birthday cake with an unlit candle">
      <defs><radialGradient id="g"><stop offset="0" stop-color="#ffc83d" stop-opacity=".6"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient></defs>
      <circle class="glow" cx="110" cy="34" r="60" fill="url(#g)"/>
      <g class="idle">
        <ellipse class="part" style="--d:0s" cx="110" cy="216" rx="100" ry="14" fill="#fff3e4"/>
        <g class="part" style="--d:.35s">
          <rect x="28" y="150" width="164" height="62" rx="12" fill="#7a2e3f"/>
          <rect x="28" y="150" width="164" height="16" rx="8" fill="#fff3e4"/>
          <g fill="#fff3e4"><rect x="44" y="160" width="14" height="26" rx="7"/><rect x="92" y="160" width="14" height="20" rx="7"/><rect x="140" y="160" width="14" height="30" rx="7"/><rect x="172" y="160" width="12" height="18" rx="6"/></g>
          <g stroke-width="4" stroke-linecap="round"><path d="M50 198h8" stroke="#ffc83d"/><path d="M86 192h8" stroke="#3fd0c0"/><path d="M118 200h8" stroke="#ffc83d"/><path d="M152 196h8" stroke="#ff9fc0"/><path d="M70 204h8" stroke="#3fd0c0"/><path d="M176 202h8" stroke="#ffc83d"/></g>
        </g>
        <g class="part" style="--d:.7s">
          <rect x="56" y="98" width="108" height="54" rx="10" fill="#ff5c93"/>
          <rect x="56" y="98" width="108" height="15" rx="7.5" fill="#fff3e4"/>
          <g fill="#fff3e4"><rect x="68" y="108" width="13" height="24" rx="6.5"/><rect x="104" y="108" width="13" height="18" rx="6.5"/><rect x="140" y="108" width="13" height="28" rx="6.5"/></g>
          <g stroke-width="4" stroke-linecap="round"><path d="M72 142h8" stroke="#ffc83d"/><path d="M100 136h8" stroke="#fff3e4"/><path d="M128 144h8" stroke="#ffc83d"/><path d="M148 140h8" stroke="#3fd0c0"/></g>
        </g>
        <g class="part" style="--d:1.05s">
          <rect x="104" y="58" width="12" height="42" rx="3" fill="#ffc83d"/>
          <path d="M104 70l12-5M104 82l12-5M104 94l12-5" stroke="#ff3d7f" stroke-width="4"/>
          <rect x="108.5" y="48" width="3" height="11" fill="#fff3e4"/>
        </g>
        <path class="flame" d="M110 14 C121 30 122 42 110 50 C98 42 99 30 110 14Z" fill="#ffc83d"/>
        <path class="flame" d="M110 30 C115 38 115 44 110 48 C105 44 105 38 110 30Z" fill="#ff7a3d"/>
      </g>
    </svg>
    <p>There are a few buttons ahead. Press them in order.</p>
    <button class="btn" id="light">Light the candle</button>`,
  () => `
    <h2>There she is.</h2>
    <figure class="polaroid" style="--tilt:-3deg"><img src="p1.jpg" alt="Birthday girl in a cream embroidered kurta"><figcaption>Main character energy</figcaption></figure>
    <button class="btn pink" data-next>Make a wish</button>`,
  () => `
    <h2>Don't tell anyone what you wished for.</h2>
    <figure class="polaroid" style="--tilt:2.5deg"><img src="p2.jpg" alt="Birthday girl in golden sunlight"><figcaption>Golden hour, golden you</figcaption></figure>
    <button class="btn" data-next>Cut the cake</button>`,
  () => `
    <h2>Okay, one more look.</h2>
    <figure class="polaroid" style="--tilt:-2deg"><img src="p3.jpg" alt="Three close-up photos with winged eyeliner and silver earrings"><figcaption>That look. Iconic.</figcaption></figure>
    <button class="btn pink" data-next>Press play</button>`,
  () => `
    <h2>Just for the memories.</h2>
    <figure class="polaroid" style="--tilt:1.5deg"><video src="clip.mp4" controls playsinline preload="auto" id="vid"></video></figure>
    <button class="btn" data-next>One last button</button>`,
  () => `
    <h1 class="big" aria-label="Happy Birthday">${"HAPPY".split("").map(c=>`<span>${c}</span>`).join("")}<br>${"BIRTHDAY".split("").map(c=>`<span>${c}</span>`).join("")}</h1>
    <p>${NAME ? NAME + ", " : ""}you deserve the best day ever. Love you loads, and never change.</p>
    <div class="row">
      <figure class="polaroid" style="--tilt:-4deg"><img src="p1.jpg" alt=""></figure>
      <figure class="polaroid" style="--tilt:2deg"><img src="p2.jpg" alt=""></figure>
      <figure class="polaroid" style="--tilt:-2deg"><img src="p3.jpg" alt=""></figure>
    </div>
    <button class="btn pink" id="again">More confetti</button>
    <button class="link" id="restart">Start over</button>`
];

dots.innerHTML = steps.map(() => "<i></i>").join("");

function show(i){
  cur = i;
  stage.innerHTML = '<section class="step">' + steps[i]() + "</section>";
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  window.scrollTo({top:0});
  
  stage.querySelectorAll("[data-next]").forEach(b => b.onclick = () => {
    tryPlayMusic();
    show(cur + 1);
  });

  if (i === 0) {
    document.getElementById("light").onclick = e => {
      tryPlayMusic();
      e.target.disabled = true;
      document.getElementById("candle").classList.add("lit");
      const sec = stage.querySelector(".step");
      sec.querySelector("h1").remove();
      sec.querySelector("p").remove();
      e.target.remove();
      const num = document.createElement("div");
      num.className = "count";
      sec.appendChild(num);
      let n = 3;
      const go = () => {
        if (n === 0) return show(1);
        num.textContent = n;
        num.style.animation = "none"; void num.offsetWidth; num.style.animation = "";
        n--;
        setTimeout(go, 900);
      };
      setTimeout(go, 600);
    };
  }
  if (i === 5) {
    burst(); setTimeout(burst, 900);
    document.getElementById("again").onclick = burst;
    document.getElementById("restart").onclick = () => show(0);
  }
  if (i === 4) {
    const v = document.getElementById("vid");
    if(!audio.paused) {
      audio.pause();
      musicBtn.textContent = "🎵 Music: Off (Video Playing)";
    }
    v.play().catch(() => {});
  }
}

// confetti
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function burst(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ffc83d","#ff3d7f","#fff3e4","#3fd0c0","#ff7a3d"];
  for (let k = 0; k < 160; k++) {
    parts.push({
      x: cv.width / 2, y: cv.height * .35,
      vx: (Math.random() - .5) * 18 * devicePixelRatio,
      vy: (-Math.random() * 16 - 4) * devicePixelRatio,
      r: (4 + Math.random() * 6) * devicePixelRatio,
      a: Math.random() * 6, va: (Math.random() - .5) * .4,
      c: colors[k % colors.length], life: 160 + Math.random() * 80
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 40);
  for (const p of parts) {
    p.vy += .35 * devicePixelRatio; p.vx *= .99;
    p.x += p.vx; p.y += p.vy; p.a += p.va; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
    cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!parts.length) cx.clearRect(0, 0, cv.width, cv.height);
}

show(0);
</script>

</body></html>
